<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>莫兰迪流体渐变背景</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  .bg-container {
    position: fixed;
    inset: 0;
    z-index: -2;
    /* 基础莫兰迪色底色：雾霾蓝到奶油黄 */
    background: linear-gradient(
      135deg,
      #b8c6d4 0%,
      #c2cbd8 20%,
      #d1d5d0 40%,
      #ddd8cb 60%,
      #e5dcc8 80%,
      #ebe1c5 100%
    );
  }

  /* 流体层1：大色块柔和漂浮 */
  .fluid-layer {
    position: fixed;
    inset: 0;
    z-index: -1;
    opacity: 0.55;
    filter: blur(80px) saturate(0.8);
    animation: drift1 25s ease-in-out infinite alternate;
  }

  .fluid-layer::before,
  .fluid-layer::after {
    content: '';
    position: absolute;
    border-radius: 50%;
  }

  .fluid-layer::before {
    width: 60vw;
    height: 60vh;
    top: -10%;
    left: -10%;
    background: radial-gradient(ellipse, #a8b8c8 0%, transparent 70%);
    animation: drift2 30s ease-in-out infinite alternate;
  }

  .fluid-layer::after {
    width: 50vw;
    height: 50vh;
    bottom: -10%;
    right: -10%;
    background: radial-gradient(ellipse, #e2d5b8 0%, transparent 70%);
    animation: drift3 28s ease-in-out infinite alternate;
  }

  /* 流体层2：中间过渡色 */
  .fluid-mid {
    position: fixed;
    inset: 0;
    z-index: -1;
    opacity: 0.4;
    filter: blur(100px) saturate(0.7);
  }

  .fluid-mid::before {
    content: '';
    position: absolute;
    width: 45vw;
    height: 55vh;
    top: 20%;
    left: 30%;
    border-radius: 50%;
    background: radial-gradient(ellipse, #c5cfc0 0%, transparent 65%);
    animation: drift4 35s ease-in-out infinite alternate;
  }

  .fluid-mid::after {
    content: '';
    position: absolute;
    width: 35vw;
    height: 40vh;
    top: 50%;
    left: 10%;
    border-radius: 50%;
    background: radial-gradient(ellipse, #d8d0c0 0%, transparent 65%);
    animation: drift5 32s ease-in-out infinite alternate;
  }

  /* 磨砂质感层 */
  .grain-overlay {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 200px 200px;
  }

  /* 极淡光泽层，增加通透感 */
  .sheen {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: radial-gradient(
      ellipse 80% 60% at 30% 25%,
      rgba(255,255,255,0.15) 0%,
      transparent 50%
    );
  }

  @keyframes drift1 {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(3vw, 2vh) scale(1.05); }
  }

  @keyframes drift2 {
    0%   { transform: translate(0, 0) rotate(0deg); }
    100% { transform: translate(5vw, 3vh) rotate(5deg); }
  }

  @keyframes drift3 {
    0%   { transform: translate(0, 0) rotate(0deg); }
    100% { transform: translate(-4vw, -2vh) rotate(-3deg); }
  }

  @keyframes drift4 {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(-3vw, 4vh) scale(1.08); }
  }

  @keyframes drift5 {
    0%   { transform: translate(0, 0); }
    100% { transform: translate(4vw, -3vh); }
  }

  /* 演示内容 */
  .demo-content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
    text-align: center;
    color: #5a6370;
  }

  .demo-content h1 {
    font-size: clamp(1.5rem, 4vw, 2.5rem);
    font-weight: 300;
    letter-spacing: 0.08em;
    margin-bottom: 0.8rem;
    color: #6b7a8a;
  }

  .demo-content p {
    font-size: clamp(0.9rem, 2vw, 1.1rem);
    font-weight: 300;
    line-height: 1.8;
    max-width: 520px;
    color: #8a939e;
    letter-spacing: 0.03em;
  }

  .card {
    margin-top: 2.5rem;
    padding: 2rem 2.5rem;
    background: rgba(255,255,255,0.35);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 16px;
    box-shadow: 0 4px 30px rgba(0,0,0,0.03);
    max-width: 400px;
  }

  .card .label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #9aa3ad;
    margin-bottom: 0.5rem;
  }

  .card .value {
    font-size: 2rem;
    font-weight: 300;
    color: #6b7a8a;
  }

  .color-strip {
    display: flex;
    gap: 6px;
    margin-top: 2rem;
  }

  .color-strip span {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.5);
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
</style>
</head>
<body>

<div class="bg-container"></div>
<div class="fluid-layer"></div>
<div class="fluid-mid"></div>
<div class="sheen"></div>
<div class="grain-overlay"></div>

<div class="demo-content">
  <h1>莫兰迪流体渐变</h1>
  <p>雾霾蓝到奶油黄的柔和过渡，低饱和度莫兰迪色系，带极淡磨砂质感</p>

  <div class="card">
    <div class="label">主色调</div>
    <div class="value">#b8c6d4 → #ebe1c5</div>
  </div>

  <div class="color-strip">
    <span style="background:#b8c6d4"></span>
    <span style="background:#c2cbd8"></span>
    <span style="background:#c5cfc0"></span>
    <span style="background:#d1d5d0"></span>
    <span style="background:#ddd8cb"></span>
    <span style="background:#e5dcc8"></span>
    <span style="background:#ebe1c5"></span>
  </div>
</div>

</body>
</html>
